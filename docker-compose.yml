# CourtSide — orkestracija servisa (API + Worker + RabbitMQ + SQL Server)
# Svi tagovi su eksplicitno verzionisani (bez :latest) prema uputama.
# NAPOMENA: Dockerfile-ovi za api/worker se dodaju u Fazi 1.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: courtside-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${DB_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [courtside-net]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: courtside-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [courtside-net]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: CourtSide.Api/Dockerfile
    container_name: courtside-api
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:80"
      CONNECTION_STRING: "Server=sqlserver,1433;Database=${DB_NAME};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      RABBITMQ_HOST: "rabbitmq"
    ports:
      - "5000:80"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [courtside-net]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: CourtSide.Worker/Dockerfile
    container_name: courtside-worker
    env_file: .env
    environment:
      RABBITMQ_HOST: "rabbitmq"
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [courtside-net]
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
  uploads_data:

networks:
  courtside-net:
    driver: bridge
